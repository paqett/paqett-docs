# docs.paqett.com on the Paqett box: one small Caddy container serving the prerendered site from
# /opt/paqett-docs/site (put there by deploy/deploy.sh). The box's main Caddy terminates TLS and
# proxies docs.paqett.com to it over the shared `caddy_edge` network (deploy/docs.paqett.com.caddyfile).
name: paqett-docs

services:
  paqett-docs:
    image: caddy:2.10-alpine
    container_name: paqett-docs
    restart: unless-stopped
    user: '65534:65534'
    read_only: true
    cap_drop: [ALL]
    # The image's caddy binary carries cap_net_bind_service as a file capability; exec fails with
    # EPERM if that capability is not in the bounding set, even though we listen on 8080.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    mem_limit: 64m
    pids_limit: 64
    volumes:
      - /opt/paqett-docs/site:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data
      - /config
    networks: [caddy_edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  caddy_edge:
    external: true
